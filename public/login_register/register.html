<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UniBite | Sign Up</title>
    <link rel="stylesheet" href="register.css">
</head>
<body>

    <!-- NAVIGATION BAR -->
    <nav class="navbar">
        <div class="logo"><a href="../index.html">UniBite</a></div>
        <div class="nav-buttons">
            <button class="login"><a href="login.html" data-i18n="login">Login</a></button>
            <button class="signup" disabled data-i18n="signup">Sign Up</button>
        </div>
    </nav>

    <!-- REGISTER FORM -->
    <section class="auth-container">
        <div class="auth-form">
            <a class="auth-close" href="../index.html" aria-label="Close and return to home">✕</a>
            <h2 data-i18n="registerTitle">Create Your UniBite Account</h2>
            <form>
                <div class="form-group">
                    <label for="name" data-i18n="fullName">Full Name</label>
                    <input type="text" id="name" name="name" required>
                </div>
                <div class="form-group">
                    <label for="email" data-i18n="email">Email</label>
                    <input type="email" id="email" name="email" required>
                </div>
                <div class="form-group">
                    <label for="password" data-i18n="password">Password</label>
                    <input type="password" id="password" name="password" required>
                </div>
                <div class="form-group">
                    <label for="confirm-password" data-i18n="confirmPassword">Confirm Password</label>
                    <input type="password" id="confirm-password" name="confirm-password" required>
                </div>
                <button type="submit" class="auth-button" data-i18n="signup">Sign Up</button>
            </form>
            <p class="form-footer">
                <span data-i18n="haveAccount">Already have an account?</span>
                <a href="login.html" data-i18n="loginHere">Login here</a>
            </p>
        </div>
    </section>
    <script src="register.js"></script>

</body>
</html>
