<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UniBite | Login</title>
    <link rel="stylesheet" href="login.css">
</head>
<body>

    <!-- NAVIGATION BAR -->
    <nav class="navbar">
        <div class="logo"><a href="../index.html">UniBite</a></div>
        <div class="nav-buttons">
            <button class="login" disabled data-i18n="login">Login</button>
            <button class="signup"><a href="register.html" data-i18n="signup">Sign Up</a></button>
        </div>
    </nav>

    <!-- LOGIN FORM -->
    <section class="auth-container">
        <div class="auth-form">
            <a class="auth-close" href="../index.html" aria-label="Close and return to home">✕</a>
            <h2 data-i18n="loginTitle">Login to UniBite</h2>
            <h4 class="hidden"></h4>
            <form>
                <div class="form-group">
                    <label for="email" data-i18n="email">Email</label>
                    <input type="email" id="email" name="email" required>
                </div>
                <div class="form-group">
                    <label for="password" data-i18n="password">Password</label>
                    <input type="password" id="password" name="password" required>
                </div>
                <button type="submit" class="auth-button" data-i18n="login">Login</button>
            </form>
            <p class="form-footer">
                <span data-i18n="noAccount">Don't have an account?</span>
                <a href="register.html" data-i18n="signupHere">Sign up here</a>
            </p>
        </div>
    </section>
    <script src="login.js"></script>

</body>
</html>
