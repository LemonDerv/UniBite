<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UniBite | Admin Dashboard</title>
    <link rel="stylesheet" href="admin_dashboard.css">
</head>

<body class="theme-light">

    <!-- TOPBAR -->
    <header class="topbar">
        <a href="/" class="logo">UniBite</a>
        <span class="admin-label">Admin Dashboard</span>
    </header>

    <main class="admin-main">

        <header class="page-heading">
            <h1>Platform Statistics</h1>
            <p>Statistics Overview for UniBite</p>
        </header>

        <!-- D1 -->
        <section class="stat-card stat-row">
            <h2>Meals Shared This Month</h2>
            <p class="stat-number"></p>
        </section>

        <!-- D2 - TOP DONOR -->
        <section class="stat-card stat-row">
            <h2>Top Donor</h2>
            <div class="donor-info">
                <p class="donor-name"></p>
                <p class="donor-meta"></p>
            </div>
        </section>

        <!-- D2 - TOP POSTS -->
        <section class="posts-section">
            <h2>Top 5 Rated Posts</h2>
            <div class="post-list">
            </div>
        </section>
    </main>

    <!-- MODAL -->
    <div class="info-modal hidden">
        <div class="modal-overlay"></div>

        <div class="modal-content">
            <h2>Post Details</h2>
            <p></p>
            <p></p>
            <p></p>
            <p></p>
            <div class="modal-actions">
                <button class="btn secondary">Close</button>
            </div>
        </div>
    </div>

<script src="admin_dashboard.js"></script>
</body>
</html>
